[package]
name = "ccp-observe-desktop"
version = "1.0.0"
description = "ccp-observe desktop shell — starts the local proxy and embeds its panel"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ccp_observe_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
